name: RSS-Feed aktualisieren

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rss-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests ausführen
        run: python -m unittest discover -s tests -v

      - name: Feed aktualisieren
        run: python update_feed.py

      - name: Änderungen veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml data/items.json data/state.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "RSS-Feed automatisch aktualisieren"
            git push
          fi
